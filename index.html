<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>JOKER XUE Songs</title>
<style>
  :root {
    --bg: #0f0f12; --card: #1a1a20; --text: #e8e8ec;
    --muted: #8a8a96; --accent: #6ea8fe;
    --border: #2a2a34;
  }
  html[data-theme="light"] {
    --bg: #f5f5f7; --card: #ffffff; --text: #1a1a1f;
    --muted: #7a7a86; --accent: #2f6fed;
    --border: #e2e2e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    padding: 32px 16px calc(40px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    transition: background .25s, color .25s;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .header {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 12px; margin-bottom: 6px;
  }
  h1 { font-size: 26px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .theme-btn {
    flex-shrink: 0; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-btn:active { transform: scale(.92); }

  .tour-card {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, #6ea8fe 0%, #a86efe 100%);
    color: #fff; border-radius: 14px; padding: 18px 20px;
    margin-bottom: 22px; text-decoration: none;
    box-shadow: 0 8px 24px rgba(110,168,254,.25);
    transition: transform .15s, box-shadow .2s;
  }
  .tour-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(110,168,254,.35);
  }
  .tour-card:active { transform: translateY(0) scale(.99); }
  .tour-icon { font-size: 28px; flex-shrink: 0; }
  .tour-info { flex: 1; min-width: 0; }
  .tour-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .tour-desc { font-size: 12px; opacity: .85; }
  .tour-arrow { font-size: 20px; opacity: .9; flex-shrink: 0; }

  .search {
    width: 100%; padding: 12px 16px; margin-bottom: 24px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 15px;
    outline: none; transition: border-color .2s, background .25s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }

  .group {
    background: var(--card); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px;
    transition: background .25s;
  }
  .group h2 {
    font-size: 14px; font-weight: 600; color: var(--accent);
    margin-bottom: 12px; letter-spacing: 0.5px;
  }
  ol { list-style: none; counter-reset: song; columns: 2; column-gap: 28px; }
  @media (max-width: 600px) { ol { columns: 1; } }
  li { counter-increment: song; font-size: 15px; padding: 6px 0; break-inside: avoid; }
  li::before {
    content: counter(song) ".";
    color: var(--muted); font-size: 12px;
    margin-right: 8px; font-variant-numeric: tabular-nums;
  }
  .song {
    color: var(--text); text-decoration: none;
    transition: color .15s; display: inline-block; cursor: pointer;
  }
  .song:hover, .song:active { color: var(--accent); }

  mark.hl {
    background: rgba(110,168,254,.35);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  html[data-theme="light"] mark.hl {
    background: rgba(47,111,237,.25);
  }

  .hide { display: none !important; }
  .no-result {
    text-align: center; color: var(--muted);
    padding: 40px 0; font-size: 15px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>JOKER XUE Songs</h1>
      <p class="sub">点击歌名查看歌词 · 共 <span id="count"></span> 首</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="切换主题">🌙</button>
  </div>

  <a class="tour-card prompter" href="prompter.html">
    <span class="tour-icon">🎙️</span>
    <span class="tour-info">
      <span class="tour-title">提词器</span>
      <span class="tour-desc">双设备联动，一台控制，一台显示</span>
    </span>
    <span class="tour-arrow">›</span>
  </a>
  <a class="tour-card" href="tour.html">
    <span class="tour-info">
      <span class="tour-title">万兽之王巡回演唱会</span>
      <span class="tour-desc">点击查看巡演歌单</span>
    </span>
    <span class="tour-arrow">›</span>
  </a>
  <a class="tour-card" href="tour-tianwai.html">
    <span class="tour-info">
      <span class="tour-title">天外来物世界巡回演唱会</span>
      <span class="tour-desc">点击查看巡演歌单</span>
    </span>
    <span class="tour-arrow">›</span>
  </a>

  <input class="search" id="search" type="search" placeholder="搜索歌名…" autocomplete="off">
  <div id="app"></div>
  <div class="no-result hide" id="noResult">没有找到匹配的歌曲</div>
</div>

<script>
/* 主题切换 */
const themeBtn = document.getElementById("themeBtn");
const root = document.documentElement;

function applyTheme(theme) {
  root.setAttribute("data-theme", theme);
  themeBtn.textContent = theme === "light" ? "☀️" : "🌙";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === "light" ? "#f5f5f7" : "#0f0f12";
  try { localStorage.setItem("xuezhiqian-theme", theme); } catch (e) {}
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("xuezhiqian-theme"); } catch (e) {}
  if (saved) applyTheme(saved);
  else {
    const prefersLight = window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(prefersLight ? "light" : "dark");
  }
}
themeBtn.addEventListener("click", () => {
  const current = root.getAttribute("data-theme") || "dark";
  applyTheme(current === "light" ? "dark" : "light");
});
initTheme();

/* 歌曲数据 */
const data = [
  { title: "2006《薛之谦》", songs: ["认真的雪","黄色枫叶","王子归来","红尘女子","爱不走","快乐帮","我的SHOW","钗头凤","MEMORIS"] },
  { title: "2007《你过得好吗》", songs: ["苏黎世的从前","你过得好吗","爱情宣判","朋友你们还好吗","爱的期限","马戏小丑","倾城","续雪","丢手绢"] },
  { title: "2008《深深爱过你》", songs: ["传说","深深爱过你","给我的爱人","我们的世界","星河之役","Let You Go","你过得好吗","梦开始的原点"] },
  { title: "2009《未完成的歌》", songs: ["未完成的歌","我的雅典娜","传说","马戏小丑","你过得好吗","红尘女子","认真的雪","倾城","给我的爱人","爱的期限","我们的世界","黄色枫叶","爱我的人谢谢你","Memory"] },
  { title: "2012《几个薛之谦》", songs: ["我知道你都知道","几个你","伏笔","为什么","我终于成了别人的女人","敷衍","我们爱过就好","楚河汉界","为了遇见你"] },
  { title: "2013《意外》", songs: ["丑八怪","意外","你还要我怎样","其实","方圆几里","有没有","潮流季","等我回家","我想起了你"] },
  { title: "2015《绅士》EP", songs: ["演员","绅士","下雨了"] },
  { title: "2016《初学者》", songs: ["初学者","刚刚好","我好像在哪见过你","小孩","一半","绅士","演员","下雨了","花儿和少年","Stay Here"] },
  { title: "2017《渡》", songs: ["动物世界","暧昧","像风一样","高尚","骆驼","别","渡","背过手","火星人来过","我害怕"] },
  { title: "2018《怪咖》", songs: ["摩天大楼","怪咖","违背的青春","天份","肆无忌惮","醒来","哑巴","那是你离开了北京的生活","最好","狐狸"] },
  { title: "2019《尘》", songs: ["木偶人","慢半拍","陪你去流浪","病态","尘","笑场","这么久没见","环","聊表心意","配合"] },
  { title: "2020《天外来物》", songs: ["天外来物","迟迟","耗尽","彩券","不爱我","纸船","潘金莲","野心","把你揉碎捏成苹果","小尖尖"] },
  { title: "2022《无数》", songs: ["变废为宝","洛城","凤毛麟角","无数","可","男二号","你不是一个人","守候","被人","关于你"] },
  { title: "2024《守村人》", songs: ["AI","守村人","念","崇拜","情书","Nothing","银河少年","租购","解解闷","在那天回不去的路上"] },
  { title: "近年单曲", songs: ["媚人","顽疾","湖泊","跃","金斧子银斧子","霸王别姬","天后"]},
];

/* 渲染列表 */
const app = document.getElementById("app");
const noResult = document.getElementById("noResult");
let total = 0;

data.forEach(group => {
  total += group.songs.length;
  const div = document.createElement("div");
  div.className = "group";
  const h2 = document.createElement("h2");
  h2.textContent = group.title;
  const ol = document.createElement("ol");
  group.songs.forEach(s => {
    const li = document.createElement("li");
    li.dataset.song = s.toLowerCase();
    const a = document.createElement("a");
    a.className = "song";
    a.textContent = s;
    a.dataset.name = s;
    a.href = "lyrics.html?song=" + encodeURIComponent(s);
    li.appendChild(a);
    ol.appendChild(li);
  });
  div.appendChild(h2);
  div.appendChild(ol);
  app.appendChild(div);
});
document.getElementById("count").textContent = total;

/* 搜索过滤 + 高亮 */
const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  let visible = 0;

  document.querySelectorAll(".group").forEach(group => {
    let groupVisible = 0;
    group.querySelectorAll("li").forEach(li => {
      const songEl = li.querySelector(".song");
      const fullName = songEl.dataset.name || songEl.textContent;
      const match = !q || fullName.toLowerCase().includes(q);

      if (match) {
        if (q) {
          const lower = fullName.toLowerCase();
          const idx = lower.indexOf(q);
          if (idx >= 0) {
            const before = escapeHtml(fullName.slice(0, idx));
            const hit = escapeHtml(fullName.slice(idx, idx + q.length));
            const after = escapeHtml(fullName.slice(idx + q.length));
            songEl.innerHTML = before + '<mark class="hl">' + hit + '</mark>' + after;
          } else {
            songEl.textContent = fullName;
          }
        } else {
          songEl.textContent = fullName;
        }
        li.classList.remove("hide");
        groupVisible++;
      } else {
        li.classList.add("hide");
      }
    });
    group.classList.toggle("hide", groupVisible === 0);
    visible += groupVisible;
  });

  noResult.classList.toggle("hide", visible > 0);
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}
</script>
</body>
</html>

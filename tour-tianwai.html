<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>天外来物世界巡回演唱会</title>
<style>
  :root {
    --bg: #0f0f12; --card: #1a1a20; --text: #e8e8ec;
    --muted: #8a8a96; --accent: #6ea8fe; --border: #2a2a34;
  }
  html[data-theme="light"] {
    --bg: #f5f5f7; --card: #ffffff; --text: #1a1a1f;
    --muted: #7a7a86; --accent: #2f6fed; --border: #e2e2e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    transition: background .25s, color .25s;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 12px;
  }
  .back {
    color: var(--accent); text-decoration: none;
    font-size: 15px; white-space: nowrap; flex-shrink: 0;
    padding: 4px 8px; margin-left: -8px; border-radius: 6px;
  }
  .back:active { background: rgba(110,168,254,.15); }
  .topbar h1 {
    font-size: 17px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .content {
    padding: 24px 20px calc(80px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  .tour-list {
    background: var(--card);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .tour-list h2 {
    font-size: 14px; font-weight: 600; color: var(--accent);
    margin-bottom: 12px; letter-spacing: 0.5px;
  }
  ol { list-style: none; counter-reset: song; }
  li { counter-increment: song; padding: 8px 0; font-size: 15px; }
  li::before {
    content: counter(song) ".";
    color: var(--muted); font-size: 12px;
    margin-right: 8px; font-variant-numeric: tabular-nums;
  }
  .song {
    color: var(--text); text-decoration: none;
    transition: color .15s; display: inline-block;
  }
  .song:hover, .song:active { color: var(--accent); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 返回</a>
    <h1>天外来物世界巡回演唱会</h1>
  </div>
  <div class="content">
    <div class="tour-list">
      <h2>巡演歌单</h2>
      <ol id="tourSongs"></ol>
    </div>
  </div>

<script>
/* 主题初始化 */
(function() {
  let saved = null;
  try { saved = localStorage.getItem("xuezhiqian-theme"); } catch (e) {}
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
    document.documentElement.setAttribute("data-theme", "light");
})();

/* 巡演歌单（可自行增删） */
const tourSongs = [
  "天外来物",
  "王子归来",
  "慢半拍",
  "丑八怪",
  "火星人来过",
  "无数",
  "动物世界",
  "绅士",
  "崇拜",
  "认真的雪",
  "深深爱过你",
  "暧昧",
  "黄色枫叶",
  "刚刚好",
  "你还要我怎样",
  "天份",
  "怪咖",
  "那是你离开了北京的生活",
  "方圆几里",
  "其实",
  "一半",
  "意外",
  "违背的青春",
  "我好像在哪见过你",
  "刚刚好",
  "聊表心意",
  "总会",
  "AI",
  "野心",
  "陪你去流浪",
  "这么久没见",
  "解解闷",
  "演员",
  "像风一样",
  "守村人",
  "天外来物"
];

const ol = document.getElementById("tourSongs");
tourSongs.forEach(s => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "song";
  a.textContent = s;
  a.href = "lyrics.html?song=" + encodeURIComponent(s);
  li.appendChild(a);
  ol.appendChild(li);
});
</script>
</body>
</html>
